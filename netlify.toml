[build]
  publish = "app"

[context.deploy-preview]
  publish = "app"

[context.branch-deploy]
  publish = "app"

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(self), geolocation=(self)"

# Evita que o navegador reutilize HTML e scripts antigos após uma publicação.
[[headers]]
  for = "/"
  [headers.values]
    Cache-Control = "no-cache, no-store, must-revalidate"

[[headers]]
  for = "/index.html"
  [headers.values]
    Cache-Control = "no-cache, no-store, must-revalidate"

[[headers]]
  for = "/app.js"
  [headers.values]
    Cache-Control = "no-cache, no-store, must-revalidate"

[[headers]]
  for = "/cloud.js"
  [headers.values]
    Cache-Control = "no-cache, no-store, must-revalidate"
