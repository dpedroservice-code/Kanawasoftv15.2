[build]
  publish = "app"

[context.deploy-preview]
  publish = "app"

[context.branch-deploy]
  publish = "app"

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(self), geolocation=(self)"
