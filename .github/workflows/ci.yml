name: Kanawa CI

on:
  pull_request:
    branches: [main, audit/fix-sales-validation]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Check JavaScript syntax
        run: |
          node --check app/sales-money.js
          node --check app/cloud.js
          node --check app/app.js
      - name: Run unit tests
        run: npm test
