name: Kanawa CI

on:
  pull_request:
    branches: [main, audit/fix-sales-validation, feat/kanawasoft-v15.4-plano-tecnica, feat/kanawasoft-v15.4-maps-gps-tracking]
  push:
    branches: [main, feat/kanawasoft-v15.4-plano-tecnica]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Setup Deno
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - name: Check JavaScript syntax
        run: |
          find app server netlify/functions -type f \( -name '*.js' -o -name '*.mjs' \) -print0 |
            xargs -0 -r -n1 node --check
      - name: Check Supabase Edge Functions
        run: |
          find supabase/functions -mindepth 2 -maxdepth 2 -name 'index.ts' -print0 |
            xargs -0 -r -n1 deno check
      - name: Run unit tests
        run: npm test
