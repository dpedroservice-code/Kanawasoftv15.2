name: Kanawa CI

on:
  pull_request:
    branches: [main, audit/fix-sales-validation, feat/kanawasoft-v15.4-plano-tecnica]
  push:
    branches: [main, feat/kanawasoft-v15.4-plano-tecnica]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Setup Deno
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - name: Check JavaScript syntax
        run: |
          node --check app/sales-money.js
          node --check app/permissions.js
          node --check app/cloud.js
          node --check app/payment-methods.js
          node --check app/app.js
          node --check app/technical-pricing.js
          node --check app/technical-cloud.js
          node --check app/technical-suite.js
          node --check app/integration-center.js
          node --check server/server.js
          node --check server/routes.js
      - name: Check Supabase Edge Function
        run: deno check supabase/functions/ks-invite-member/index.ts
      - name: Run unit tests
        run: npm test
