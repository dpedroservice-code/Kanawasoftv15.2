name: Kanawa CI

on:
  pull_request:
    branches: [main, audit/fix-sales-validation]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Setup Deno
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - name: Check JavaScript syntax
        run: |
          node --check app/sales-money.js
          node --check app/permissions.js
          node --check app/cloud.js
          node --check app/app.js
          node --check app/performance-bridge.js
          node --check app/module-hub.js
          node --check app/gps-map.js
          node --check app/agt-config.js
      - name: Check Supabase Edge Functions
        run: |
          deno check supabase/functions/ks-invite-member/index.ts
          deno check --config supabase/functions/ks-agt-test/deno.json supabase/functions/ks-agt-test/index.ts
      - name: Run unit tests
        run: npm test
